---
# Variables especificas para el servidor de base de datos
mysql_root_password: "supersegura"   # En produccion: ansible-vault

mysql_databases:
  - name: webapp
    encoding: utf8mb4
    collation: utf8mb4_general_ci

mysql_users:
  - name: webapp_user
    host: "%"
    password: "userpass"             # En produccion: ansible-vault
    priv: "webapp.*:ALL"

# En Debian los includes de MariaDB van aqui:
mysql_config_include_files:
  - src: my.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-custom.cnf
