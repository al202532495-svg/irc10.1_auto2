---
# Variables especificas para servidores web (Debian/Ubuntu/Kali)
apache_listen_port: 80

apache_vhosts:
  - servername: "example.com"
    documentroot: "/var/www/example"
    extra_parameters: |
      ErrorLog  ${APACHE_LOG_DIR}/example.com-error.log
      CustomLog ${APACHE_LOG_DIR}/example.com-access.log combined

# En Debian el meta-paquete "php" instala la version actual (8.x en Kali)
php_packages:
  - php
  - php-cli
  - php-mysql
  - php-zip
  - php-gd
  - php-xml
  - libapache2-mod-php
