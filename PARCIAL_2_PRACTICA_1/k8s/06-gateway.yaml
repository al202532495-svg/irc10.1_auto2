apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: micro/gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # nginx no usa los dominios de busqueda, por eso el nombre completo (FQDN)
            - name: AUTH_HOST
              value: auth-service.microservicios.svc.cluster.local
            - name: TASKS_HOST
              value: tasks-service.microservicios.svc.cluster.local
            - name: DASHBOARD_HOST
              value: dashboard-service.microservicios.svc.cluster.local
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 128Mi }
---
# NodePort: expone el gateway fuera del cluster (minikube service gateway -n microservicios)
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: microservicios
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
