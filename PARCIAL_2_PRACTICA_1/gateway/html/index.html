<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microservicios - Tareas</title>
<style>
  :root { --fondo:#f4f5f7; --tarjeta:#fff; --texto:#1f2933; --suave:#6b7280; --acento:#2563eb; --ok:#15803d; --error:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fondo); color:var(--texto); }
  header { background:#111827; color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1000px; margin:24px auto; padding:0 16px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  .tarjeta { background:var(--tarjeta); border-radius:10px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tarjeta h2 { margin:0 0 4px; font-size:16px; }
  .meta { font-size:12px; color:var(--suave); margin-bottom:12px; font-family:ui-monospace, monospace; min-height:1em; }
  input { width:100%; padding:9px; border:1px solid #d1d5db; border-radius:6px; margin-bottom:8px; font-size:14px; }
  button { background:var(--acento); color:#fff; border:0; border-radius:6px; padding:9px 14px; cursor:pointer; font-size:14px; }
  button.sec { background:#e5e7eb; color:var(--texto); }
  .fila { display:flex; gap:8px; }
  .fila input { margin:0; }
  .msg { font-size:13px; margin-top:8px; min-height:1em; }
  .msg.error { color:var(--error); } .msg.ok { color:var(--ok); }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #eee; }
  li span { flex:1; } li.hecha span { text-decoration:line-through; color:var(--suave); }
  li button { padding:4px 8px; font-size:12px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .stats div { background:var(--fondo); border-radius:8px; padding:10px; }
  .stats b { display:block; font-size:24px; }
  .caido { background:#fef2f2; border:1px solid #fecaca; color:var(--error); padding:12px; border-radius:8px; font-size:14px; }
  .oculto { display:none; }
</style>
</head>
<body>
<header>
  <h1>App de tareas &middot; 3 microservicios</h1>
  <div id="sesion"></div>
</header>

<main>
  <!-- auth-service -->
  <section class="tarjeta" id="panel-login">
    <h2>Login (auth-service)</h2>
    <div class="meta" id="meta-auth"></div>
    <input id="usuario" placeholder="usuario">
    <input id="clave" type="password" placeholder="contrasena (min 6)">
    <div class="fila">
      <button onclick="login()">Entrar</button>
      <button class="sec" onclick="registrar()">Registrarme</button>
    </div>
    <div class="msg" id="msg-auth"></div>
  </section>

  <!-- tasks-service -->
  <section class="tarjeta oculto" id="panel-tareas">
    <h2>Mis tareas (tasks-service)</h2>
    <div class="meta" id="meta-tasks"></div>
    <div class="fila">
      <input id="nueva" placeholder="Nueva tarea" onkeydown="if(event.key==='Enter')crear()">
      <button onclick="crear()">Agregar</button>
    </div>
    <div class="msg" id="msg-tasks"></div>
    <ul id="lista"></ul>
  </section>

  <!-- dashboard-service -->
  <section class="tarjeta oculto" id="panel-dashboard">
    <h2>Dashboard (dashboard-service)</h2>
    <div class="meta" id="meta-dash"></div>
    <div id="contenido-dash"></div>
    <div style="margin-top:12px"><button class="sec" onclick="cargarDashboard()">Actualizar</button></div>
  </section>
</main>

<script>
let token = null;

// Llama a la API a traves del gateway; nunca lanza excepcion
async function api(metodo, ruta, cuerpo) {
  const opciones = { method: metodo, headers: { "Content-Type": "application/json" } };
  if (token) opciones.headers.Authorization = "Bearer " + token;
  if (cuerpo) opciones.body = JSON.stringify(cuerpo);
  try {
    const r = await fetch(ruta, opciones);
    let datos = {};
    try { datos = await r.json(); } catch (_) {}
    return { ok: r.ok, status: r.status, datos };
  } catch (e) {
    return { ok: false, status: 0, datos: { error: "sin conexion con el gateway" } };
  }
}

function meta(id, d) {
  document.getElementById(id).textContent =
    d && d.atendido_por ? `v${d.version} · atendido por ${d.atendido_por}` : "";
}
function mensaje(id, texto, ok) {
  const el = document.getElementById(id);
  el.textContent = texto || ""; el.className = "msg " + (ok ? "ok" : "error");
}
const credenciales = () => ({ username: usuario.value, password: clave.value });

async function registrar() {
  const r = await api("POST", "/api/auth/register", credenciales());
  meta("meta-auth", r.datos);
  mensaje("msg-auth", r.datos.mensaje || r.datos.error, r.ok);
}

async function login() {
  const r = await api("POST", "/api/auth/login", credenciales());
  meta("meta-auth", r.datos);
  if (!r.ok) return mensaje("msg-auth", r.datos.error, false);
  token = r.datos.token;
  mensaje("msg-auth", "Sesion iniciada", true);
  document.getElementById("sesion").innerHTML =
    `${r.datos.username} <button class="sec" onclick="salir()">Salir</button>`;
  document.getElementById("panel-tareas").classList.remove("oculto");
  document.getElementById("panel-dashboard").classList.remove("oculto");
  cargarTareas(); cargarDashboard();
}

function salir() { token = null; location.reload(); }

async function cargarTareas() {
  const r = await api("GET", "/api/tasks");
  meta("meta-tasks", r.datos);
  const ul = document.getElementById("lista");
  ul.innerHTML = "";
  if (!r.ok) return mensaje("msg-tasks", r.datos.error || "error " + r.status, false);
  mensaje("msg-tasks", "");
  for (const t of r.datos.tareas) {
    const li = document.createElement("li");
    if (t.completada) li.className = "hecha";
    li.innerHTML = `<input type="checkbox" ${t.completada ? "checked" : ""} style="width:auto;margin:0">
                    <span></span><button class="sec">Borrar</button>`;
    li.querySelector("span").textContent = t.titulo;
    li.querySelector("input").onchange = e => actualizar(t.id, e.target.checked);
    li.querySelector("button").onclick = () => borrar(t.id);
    ul.appendChild(li);
  }
}

async function crear() {
  const input = document.getElementById("nueva");
  if (!input.value.trim()) return;
  const r = await api("POST", "/api/tasks", { titulo: input.value });
  if (!r.ok) return mensaje("msg-tasks", r.datos.error, false);
  input.value = ""; cargarTareas(); cargarDashboard();
}
async function actualizar(id, completada) {
  await api("PUT", "/api/tasks/" + id, { completada }); cargarTareas(); cargarDashboard();
}
async function borrar(id) {
  await api("DELETE", "/api/tasks/" + id); cargarTareas(); cargarDashboard();
}

async function cargarDashboard() {
  const r = await api("GET", "/api/dashboard/stats");
  meta("meta-dash", r.datos);
  const c = document.getElementById("contenido-dash");
  if (!r.ok) {
    c.innerHTML = `<div class="caido"></div>`;
    c.firstChild.textContent = "Dashboard no disponible: " + (r.datos.error || "error " + r.status) +
      ". El resto de la aplicacion sigue funcionando.";
    return;
  }
  const d = r.datos;
  c.innerHTML = `<div class="stats">
      <div><b>${d.total}</b>Total</div>
      <div><b>${d.pendientes}</b>Pendientes</div>
      <div><b>${d.completadas}</b>Completadas</div>
    </div>
    <p class="meta" style="margin-top:12px">datos obtenidos de tasks-service: ${d.tareas_atendido_por}</p>`;
}
</script>
</body>
</html>
